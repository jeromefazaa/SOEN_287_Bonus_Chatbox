<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Nutrition Chatbox</title>
  <!-- Link your local CSS file -->
  <link rel="stylesheet" href="style.css" />

 
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" />
</head>
<body>
  <!-- Main Titles -->
  <h1>Welcome To AI Nutrition Chatbox</h1>
  <h2>We can answer any questions you have about proper nutrition!</h2>
  <p class="subtext">Unfortunately, don’t have much knowledge about anything else</p>

  <!-- Chatbox Layout -->
  <div class="chat-container">
    <div class="chat-header">Chatbox</div>
    <div class="chat-box">
      <div class="chat-message"><span id="output">Hello! I can answer any question you have about nutrition.</span></div>
    </div>
    <form class="chat-input">
      <input type="text" placeholder="Type your message here..." autocomplete="off" id="input" />
      <button type="button" id="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
